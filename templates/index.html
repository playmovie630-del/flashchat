<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlashChat</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <h1>FlashChat</h1>
    <div id="status" class="status status-idle">Press Start to chat with a stranger.</div>
    <div class="prefs">
      <div class="pref-group">
        <label>I am:</label>
        <div class="pref-buttons">
          <label>
            <input type="radio" name="myGender" value="male" id="genderMale">
            <span>Male</span>
          </label>
          <label>
            <input type="radio" name="myGender" value="female" id="genderFemale">
            <span>Female</span>
          </label>
        </div>
      </div>
      <div class="pref-group">
        <label>I want to talk with:</label>
        <div class="pref-buttons">
          <label>
            <input type="radio" name="wantGender" value="any" id="wantAny" checked>
            <span>Any</span>
          </label>
          <label>
            <input type="radio" name="wantGender" value="male" id="wantMale">
            <span>Male</span>
          </label>
          <label>
            <input type="radio" name="wantGender" value="female" id="wantFemale">
            <span>Female</span>
          </label>
        </div>
      </div>
      <div class="pref-group">
        <label class="pref-toggle">
          <input type="checkbox" id="autoReconnect">
          <span>Auto-reconnect</span>
        </label>
      </div>
    </div>
    <div id="chat" class="chat hidden">
      <div id="messages" class="messages"></div>
      <form id="messageForm" class="composer">
        <input id="messageInput" type="text" autocomplete="off" placeholder="Type your message..." />
        <button id="sendBtn" type="submit">Send</button>
      </form>
    </div>
    <div class="controls">
      <button id="startBtn">Start Chat</button>
      <button id="leaveBtn" class="hidden secondary">Leave Chat</button>
      <button id="newBtn" class="hidden">New Chat</button>
    </div>
    <p class="notice">This is a text-only random chat app.<br />Share this page with your custom domain after deployment.</p>
  </div>
  <script src="/static/chat.js"></script>
</body>
</html>
